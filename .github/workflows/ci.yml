name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/sync-requirements.py --check
      - name: Audit runtime dependencies
        if: matrix.python == '3.12'
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o runtime-requirements.txt
          uvx pip-audit==2.10.1 -r runtime-requirements.txt --disable-pip --no-deps
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pytest testing/unit testing/integration/panel -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run test:run
      - run: npm run build
      - run: ../scripts/check-frontend-version.sh
      - run: git diff --exit-code -- ../js/comfygit-panel.js ../js/comfygit-panel.css
